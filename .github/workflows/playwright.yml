name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    # expose the secret into the job environment so we can write it to a runtime .env file
    env:
      PUBLIC_ONEDRIVE_CLIENT_ID: ${{ secrets.PUBLIC_ONEDRIVE_CLIENT_ID }}
    environment: pages

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Create .env from secret
        # write only the expected public key into a local .env file for the build
        # avoid printing the secret value to logs
        run: |
          printf 'PUBLIC_ONEDRIVE_CLIENT_ID=%s\n' "$PUBLIC_ONEDRIVE_CLIENT_ID" > .env
      - name: Build
        run: npm run build
      - name: Preview site
        run: npm run preview &
        env:
          VITE_E2E: '1'
      - name: Wait for preview
        run: npx wait-on http://localhost:4173
      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ts
        env:
          VITE_E2E: '1'
