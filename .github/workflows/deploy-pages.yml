name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # expose the secret into the job environment so we can write it to a runtime .env file
    env:
      PUBLIC_ONEDRIVE_CLIENT_ID: ${{ secrets.PUBLIC_ONEDRIVE_CLIENT_ID }}
    environment: pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secret
        # write only the expected public key into a local .env file for the build
        # avoid printing the secret value to logs
        run: |
          printf 'PUBLIC_ONEDRIVE_CLIENT_ID=%s\n' "$PUBLIC_ONEDRIVE_CLIENT_ID" > .env

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # publish_branch: gh-pages  # uncomment to explicitly set branch
